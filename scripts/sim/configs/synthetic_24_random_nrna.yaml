# Synthetic 24-condition benchmark suite requested 2026-05-12.
#
# Generate the reference first with:
#   python scripts/sim/simulate_suite.py \
#     --outdir /Users/mkiyer/Downloads/rigel_runs/sim_synthetic_24 \
#     --reference-only --genome-length 10000000 --n-genes 50 --seed 20260512
#
# Then generate reads with:
#   python scripts/sim/simulate_reads.py \
#     --config scripts/sim/configs/synthetic_24_random_nrna.yaml -j 4

genome: /Users/mkiyer/Downloads/rigel_runs/sim_synthetic_24/reference/genome.fa
gtf: /Users/mkiyer/Downloads/rigel_runs/sim_synthetic_24/reference/genes.gtf
outdir: /Users/mkiyer/Downloads/rigel_runs/sim_synthetic_24

transcript_filter: all

simulation:
  n_rna_fragments: 1_000_000
  sim_seed: 20260512
  frag_mean: 250
  frag_std: 50
  frag_min: 80
  frag_max: 800
  read_length: 150
  error_rate: 0.0
  n_workers: 4

abundance:
  mode: random
  seed: 20260513
  min: 1.0
  max: 10000.0
  frac_expressed: 0.5

gdna:
  rates: [0.0, 0.25, 1.0, 2.0]
  rate_labels: [zero, low, med, high]
  frag_mean: 350
  frag_std: 100
  frag_min: 100
  frag_max: 1000

strand_specificities: [0.50, 0.99]

nrna:
  mode: random_fraction
  ratio_ranges:
    - [0.0, 0.0]
    - [0.05, 0.25]
    - [0.50, 1.00]
  ratio_labels: [zero, low, high]
  eligible_fraction: 0.5
  seed: 20260514

oracle_bam: true
verbose: true