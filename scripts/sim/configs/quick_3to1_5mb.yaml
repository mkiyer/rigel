# ════════════════════════════════════════════════════════════════════════
# QUICK validation suite — COMPLEX 5 Mb genome, 3:1 gDNA. The fast regression gate.
#
# Purpose: validate calibration changes in ~minutes, on a genome that already exercises
# the genuinely hard phenomena — NOT a clean toy:
#   * antisense_fraction 0.15  → transcripts overlapping in opposite directions (AMBIG regions)
#   * max_isoforms 8           → multi-isoform loci, retained introns, complex splicing
#   * nascent RNA (rnd)         → nascent contamination head-to-head with none
# Small (5 Mb / 100 genes, 1M RNA, single 3:1 gDNA level) so it stays fast; the 25 Mb
# complex_benchmark_25mb is the BROAD periodic suite (same complexity, larger scale).
#
# Condition grid = 2 gDNA × 2 strand × 2 capture × 2 nascent = 16 runs:
#   gDNA:    none (FP test) + gdna300 (3:1)
#   strand:  unstranded (0.50) + stranded (0.99)
#   capture: hybrid-capture off + on
#   nascent: none + rnd (random per-transcript ratio)
# Delete the per-condition sim_oracle.bam after evaluation to keep the footprint small.
#
# Usage:
#   python scripts/sim/simulate_suite.py --config scripts/sim/configs/quick_3to1_5mb.yaml
#   python scripts/sim/evaluate_suite.py --sim-base /Users/mkiyer/Downloads/rigel_runs/quick_3to1_5mb
# ════════════════════════════════════════════════════════════════════════

suite:
  outdir: /Users/mkiyer/Downloads/rigel_runs/quick_3to1_5mb
  genome_length: 5000000
  n_genes: 100
  min_isoforms: 1
  max_isoforms: 8             # multi-isoform complexity
  target_transcripts: null
  antisense_fraction: 0.15    # opposite-strand overlaps → AMBIG regions
  seed: 20260620              # complex 5 Mb genome (distinct from the clean gdna_benchmark)
  profile: smoke

simulation:
  n_rna_fragments: 1000000
  frag_mean: 250
  frag_std: 50
  frag_min: 80
  frag_max: 800
  read_length: 150
  error_rate: 0.0
  n_workers: 16

abundance:
  seed: 20260621
  min: 1.0
  max: 10000.0
  frac_expressed: 0.5

# gDNA contamination: single 3:1 level (the runtime/realism balance point).
gdna:
  rates:       [0.0,  3.0]
  rate_labels: [none, gdna300]
  frag_mean: 350
  frag_std: 100
  frag_min: 100
  frag_max: 1000

strand_specificities: [0.99, 0.50]

# Nascent RNA: random per-transcript ratio on 50% of expressed multi-exon transcripts.
nrna:
  mode: random_fraction
  ratio_ranges:  [[0.0, 0.0], [0.1, 1.0]]   # none ⇒ no nascent;  rnd ⇒ ratio ∈ [0.1, 1.0]
  ratio_labels:  [none, rnd]
  eligible_fraction: 0.5
  seed: 20260622

capture:
  probe_length: 120
  probe_density: 0.5
  off_target_weight: 1.0
  binding_per_base: 10.0
  gdna_split_penalty: 0.2
  min_overlap: 1
  configs:
    - label: off
      enabled: false
    - label: on
      fraction: 0.5
