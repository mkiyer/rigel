# ╔═════════════════════════════════════════════════════════════╗
# ║  Simulation: CCLE salmon TPM abundances             ║
# ╚═════════════════════════════════════════════════════════════╝
#
# Usage:
#   python scripts/sim/simulate_reads.py --config scripts/sim/configs/sim_pristine.yaml

# ── Inputs ────────────────────────────────────────────────────
genome: /scratch/mkiyer_root/mkiyer0/shared_data/hulkrna/refs/human/genome_controls.fasta.bgz
gtf: /scratch/mkiyer_root/mkiyer0/shared_data/hulkrna/refs/human/genes_controls.gtf.gz
outdir: /scratch/mkiyer_root/mkiyer0/shared_data/rigel_benchmarks/ccle_vcap

# ── Transcript filter ─────────────────────────────────────────
transcript_filter: all

# ── Simulation parameters ─────────────────────────────────────
simulation:
  n_rna_fragments: 50_000_000
  sim_seed: 42
  frag_mean: 250
  frag_std: 50
  frag_min: 50
  frag_max: 1000
  read_length: 101
  error_rate: 0.0
  n_workers: 1

# ── Abundance model ───────────────────────────────────────────
abundance:
  mode: file
  seed: 42
  file: /scratch/mkiyer_root/mkiyer0/shared_data/hulkrna/runs/human/ccle_vcap_prostate/salmon/quant.sf.gz

# ── gDNA contamination ────────────────────────────────────────
gdna:
  rates: [0.5]
  rate_labels: [high]
  frag_mean: 250
  frag_std: 100
  frag_min: 100
  frag_max: 1000

# ── Strand specificity ───────────────────────────────────────
strand_specificities: [0.9]

# ── Nascent RNA spike-in sweep ────────────────────────────────
nrna:
  mode: additive_ratio
  ratios: [0.0]
  ratio_labels: [none]

# ── Hybrid capture ───────────────────────────────────────────
capture:
  probes: null
  probe_format: auto
  off_target_weight: 1.0
  binding_per_base: 10.0
  gdna_split_penalty: 0.2
  min_overlap: 1

# ── Oracle BAM ────────────────────────────────────────────────
oracle_bam: true

verbose: true
