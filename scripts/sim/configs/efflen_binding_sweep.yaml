# ════════════════════════════════════════════════════════════════════════
# EFFECTIVE-LENGTH DIAGNOSTIC SWEEP — hybrid-capture binding energy × DNA:RNA ratio.
#
# Purpose: isolate the gDNA->RNA effective-length leak as a function of capture ENRICHMENT.
# Hypothesis: capture-OFF is pristine (no leak, eff-lengths correct); as binding_per_base rises,
# gDNA concentrates on probes and the gDNA effective length should contract to the exon footprint —
# if it under-contracts, the leak grows. Realistic (multi-isoform, antisense) genome so the target
# regime is reproduced (NOT a single-isoform toy, which has its own EM confound).
#
# Grid = 3 gDNA:RNA × 5 capture-binding = 15 conditions (stranded, no nascent, to isolate).
#   python scripts/sim/simulate_suite.py --config scripts/sim/configs/efflen_binding_sweep.yaml
#   python scripts/sim/evaluate_suite.py --sim-base /Users/mkiyer/Downloads/rigel_runs/efflen_binding_sweep
# ════════════════════════════════════════════════════════════════════════

suite:
  outdir: /Users/mkiyer/Downloads/rigel_runs/efflen_binding_sweep
  genome_length: 1500000
  n_genes: 40
  min_isoforms: 1
  max_isoforms: 8
  target_transcripts: null
  antisense_fraction: 0.15
  seed: 20260703
  profile: smoke

simulation:
  n_rna_fragments: 200000
  frag_mean: 250
  frag_std: 50
  frag_min: 80
  frag_max: 800
  read_length: 150
  error_rate: 0.0
  n_workers: 16

abundance:
  seed: 20260704
  min: 1.0
  max: 10000.0
  frac_expressed: 0.5

# DNA:RNA ratio axis: very-low / equal / DNA-dominant.
gdna:
  rates:       [0.05,   1.0,     3.0]
  rate_labels: [gdna05, gdna100, gdna300]
  frag_mean: 350
  frag_std: 100
  frag_min: 100
  frag_max: 1000

strand_specificities: [0.99]     # stranded only (isolate; the target + confound are both stranded)

nrna:
  ratios: [0.0]
  ratio_labels: [none]

# BINDING-ENERGY SWEEP: off -> extreme. Each arm designs probes for 50% of eligible transcripts,
# differing only in binding_per_base (fragment-start weight = off_target_weight + binding*overlap).
capture:
  probe_length: 120
  probe_density: 0.5
  off_target_weight: 1.0
  binding_per_base: 10.0
  gdna_split_penalty: 0.2
  min_overlap: 1
  configs:
    - {label: off,  enabled: false}
    - {label: b2,   fraction: 0.5, binding_per_base: 2.0}
    - {label: b10,  fraction: 0.5, binding_per_base: 10.0}
    - {label: b50,  fraction: 0.5, binding_per_base: 50.0}
    - {label: b200, fraction: 0.5, binding_per_base: 200.0}
