# ════════════════════════════════════════════════════════════════════════════════════════════════
#  THE fl-GAP SIDE PANEL, ARM 2 — gDNA LONG (250 bp), RNA SHORT (75 bp)
# ════════════════════════════════════════════════════════════════════════════════════════════════
#
# A side panel, never a ladder rung: the same reference, index, abundances, nascent block and capture as
# `gdna_ladder.yaml`, with only the fragment-length parameters changed. The ladder gives both origins one length
# distribution because the EM scores length (one table for RNA, one for gDNA) and a gap lets it split the origins
# on length alone. So the transcript-level number here never ranks a calibration mechanism: it is read per
# stratum as the tool's end-to-end accuracy on a library with this gap, and a length mechanism is judged on both
# arms beside the equal-length ladder. A calibration mechanism is ranked here only by instruments that stop before
# the EM, such as `calibration_vs_oracle.py`.
#
# What it exercises: the pooled gDNA background is `count / E_contained(ell, pmf)`, which departs from a
# length-free estimate by
#
#     rho_r * (E_r/E_g - 1)
#
# the RNA share of a mixed pool times a factor that equal lengths pin at 1. Only short objects (exons) can see
# that factor; a pooled rate over a megabase-scale pool cannot.
#
# Two arms of opposite sign, because RNA is not reliably longer than gDNA (true for cfRNA, false elsewhere) and
# one arm alone would let the tool overfit one library type. The sign of `E_r/E_g - 1` flips between the arms, so
# a real repair moves them in opposite directions; one that trades one bias for another does not.
#
# The std moves with the mean. The sampler draws from Normal(mean, std) truncated to [frag_min, frag_max] by
# rejection (`sim/sampling.py`), so with `frag_min = 50` a mean of 75 at the ladder's std of 98 would realise near
# 138 bp; std 20 keeps the short side near 75 bp and std 60 the long side near 250. A configured length is not a
# realised one: read the gap from each condition's `truth_fragment_lengths.tsv`. The RNA side lands a little
# short of its configuration because an RNA fragment must fit inside its transcript. There are two quotable gaps,
# the library's (the raw deposit histograms) and the tool's (the fitted fl pmfs); say which.
#
# Reads are capped at the fragment length by the simulator (`read_len = min(read_length, frag_len)`), so a 100 bp
# read is safe against a 78 bp mean; most of the short side's fragments are shorter than a read and their two
# reads overlap completely.
#
# One gDNA level (g50) by design: the panel probes one mechanism whose size the length gap sets, while the ladder
# stays the ranking panel, and a 50/50 mix maximises the RNA share of the intron pool where the mechanism bites.
#
# The mirror arm is `flgap_rna_long.yaml`.
#
# Run:  python scripts/sim/panel.py status --config scripts/sim/configs/flgap_rna_short.yaml

genome: $RIGEL_RUNS/suite/reference/genome.fa
gtf: $RIGEL_RUNS/suite/reference/genes.gtf
# the ladder's reference and index, so the annotation, the probes and the synthetic nascent entities
# are identical to the ladder's
index: $RIGEL_RUNS/suite/rigel_index
outdir: $RIGEL_RUNS/suite/flgap_rna_short

# no FASTQs: every scorer reads the oracle BAM, and `panel.py` finds a condition by `sim_oracle.bam`
emit_fastq: false

# ── Read simulation — the RNA arm: SHORT ────────────────────────────────────────────────────────
simulation:
  n_total_fragments: 10000000
  n_rna_fragments: 10000000
  sim_seed: 42
  frag_mean: 75
  frag_std: 20
  frag_min: 50
  frag_max: 500
  read_length: 100
  # substitutions per base, about an Illumina run's: the oracle BAM places every read by truth and
  # records its NM; an aligner's input carries the errors as sequenced reads do
  error_rate: 0.002
  n_workers: 8

# ── Abundance — identical to the ladder ─────────────────────────────────────────────────────────
abundance:
  mode: random
  seed: 42
  min: 1.0
  max: 10000.0
  frac_expressed: 0.5

# ── gDNA — the gDNA arm: LONG ───────────────────────────────────────────────────────────────────
gdna:
  rates:       [1.0]
  rate_labels: [g50]
  genomic_refs: [chr21, chr22]
  frag_mean: 250
  frag_std: 60
  frag_min: 50
  frag_max: 500

# ── Strand — unstranded and stranded ────────────────────────────────────────────────────────────
strand_specificities: [0.50, 0.99]

# ── Nascent — the ladder's block, verbatim (`gdna_ladder.yaml` holds the rationale) ─────────────
nrna:
  mode: sparse
  abundance_ranges: [[1.0, 100.0]]
  on_fraction: 0.50
  ratio_labels: [mid]

# ── Capture — off and on ────────────────────────────────────────────────────────────────────────
capture:
  probe_format: transcript
  off_target_weight: 1.0
  binding_per_base: 10.0
  min_overlap: 1
  configs:
    - {label: "off", enabled: false}
    - {label: "on", probes: $RIGEL_RUNS/suite/reference/capture_panel.tsv}

oracle_bam: true
verbose: true
