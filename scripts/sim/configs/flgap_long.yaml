# ════════════════════════════════════════════════════════════════════════════════════════════════
#  THE FRAGMENT-LENGTH GAP PANEL — gDNA LONG, RNA SHORT
# ════════════════════════════════════════════════════════════════════════════════════════════════
#
# ⭐⭐ WHY THIS PANEL EXISTS. `length_likelihood` is OFF by default (`config.py:319`) and is the ONLY
# channel that can give an UNSTRANDED slot its own composition evidence: it is theta-independent, so
# the Schur complement that zeroes the strand term at an AMBIG node does not apply to it
# (`simplex_logodds.py:519-524`), and `tau_len` enters `tau_lam` UNGATED (`node_init.py:304-312`).
# `node_init` says so itself: gating it "would delete the only evidence AMBIG nodes ever get."
#
# ⛔⛔ AND THE LADDER CANNOT PRICE IT. `TRAPS.md` F3: at equal component mean lengths the length
# channel carries EXACTLY ZERO information about composition, at any depth — the 2x2 is identified
# only through `mu_g - mu_r`. Measured on the ladder's own post-capture truth, the realised gap is
# +3.5 to +4.5 bp on a ~237 bp mean, i.e. **1.5 %**. Turning the channel on there would measure
# approximately nothing, and that would be read as "the feature does not work" (`TRAPS.md` A8:
# prove the benchmark can resolve the axis BEFORE running it).
#
# ⭐ SO THIS PANEL VARIES EXACTLY ONE THING against the ladder: the gDNA fragment-length block.
# Everything else — the RNA length block, the abundance seed, the depth, the capture panel, the
# strand grid — is byte-for-byte the ladder's, so a difference is the length gap and nothing else.
# ⚠ `TRAPS.md` F7: never assume RNA is longer than gDNA. That is true of cfRNA and false elsewhere,
# so BOTH directions exist and neither is the default. This file is gDNA >> RNA.
#
# ⭐ ONE gDNA RUNG, `g50`. Both components are present in quantity there, which is what the 2x2
# needs; the ladder already covers the gDNA spectrum at zero gap. Adding rungs is one line.
# ⚠ 4 conditions = strand {0.50, 0.99} x capture {off, on}. `ss_0.50 x capture_on` is the focus
# cell and the other three are controls that must not regress.
#
# ⛔ BUILD IT WITH `scripts/sim/simulate_reads.py`, NOT `rigel.sim.suite` — the suite CLI
# re-parses `capture.configs` through `SuiteCaptureSpec` and SILENTLY DROPS a provided probe panel,
# which A7 caught here (the two capture arms' truth files came out byte-identical). `emit_fastq: false`
# below does the FASTQ suppression, so no CLI flag is needed.
# ⛔ FASTQs are suppressed by config. No calibration instrument reads a FASTQ, and they are half the
# on-disk size. A panel built that way cannot be handed to `scripts/benchmarking/` without
# re-simulating, which is the trade and is deliberate here.
#
#     python -m rigel.sim.suite --config scripts/sim/configs/flgap_long.yaml --no-fastq
#
# ⛔ Score the length axis against `truth_fragment_lengths.tsv` (the REALISED post-capture marginal),
# never against the configured numbers below — `TRAPS.md` F11, and F5: capture selects for length.

gtf: /Users/mkiyer/Downloads/rigel_runs/suite/reference/genes.gtf
outdir: /Users/mkiyer/Downloads/rigel_runs/suite/flgap_long
transcript_filter: all

# ── Read simulation ─────────────────────────────────────────────────────────────────────────────
# ⚠ `n_total_fragments` is what governs; `n_rna_fragments` is ignored in this mode and is left at
# the same value only so the file reads sensibly if the total is ever removed.
simulation:
  n_total_fragments: 10000000
  n_rna_fragments: 10000000
  sim_seed: 42
  # ⭐ REALISTIC AND IDENTICAL TO THE gDNA BLOCK BELOW. Real fragments run ~50 bp to ~500 bp with
  # little above that (owner). The mean and sd are MO_3021's measured RNA pool; what has changed
  # from the pilot is `frag_max` (800 -> 500) and that gDNA now shares every one of these four
  # values. ⛔ All four must match, not just the mean: a different support is itself a gap.
  frag_mean: 206
  frag_std: 98
  frag_min: 50
  frag_max: 500
  read_length: 100
  error_rate: 0.0
  n_workers: 8

# ── Abundance ───────────────────────────────────────────────────────────────────────────────────
abundance:
  mode: random
  seed: 42
  min: 1.0
  max: 10000.0
  frac_expressed: 0.5

# ── gDNA: the ladder ────────────────────────────────────────────────────────────────────────────
gdna:
  rates:       [1.0]
  rate_labels: [g50]
  # ⛔ "Has an annotation" is not "is genomic" — every ERCC reference carries one transcript, so
  # inferring this from the annotation once filled a panel with gDNA on RNA-only spike-ins, on the
  # very templates whose truth abundance of zero is the false-positive control. State it.
  genomic_refs: [chr21, chr22]
  # ⭐⭐ THE ONE THING VARIED. The RNA block above is the ladder's, untouched; only these four
  # numbers move, and all four move together because a different support is itself a gap.
  frag_mean: 330
  frag_std: 120
  frag_min: 50
  frag_max: 500

# ── Strand ──────────────────────────────────────────────────────────────────────────────────────
# ⚠ 0.50 is the focus, not merely the hard case: at kappa = 1/2 the strand likelihood carries
# EXACTLY zero information about the gDNA fraction, for any count and any overdispersion, so the
# unstranded cells isolate the density channel completely.
strand_specificities: [0.50, 0.99]

# ── Nascent: held out, as in the pilot ──────────────────────────────────────────────────────────
nrna:
  mode: additive_ratio
  ratios:       [0.0]
  ratio_labels: [none]

# ── Capture ─────────────────────────────────────────────────────────────────────────────────────
capture:
  probe_format: transcript
  off_target_weight: 1.0
  binding_per_base: 10.0
  gdna_split_penalty: 0.2
  min_overlap: 1
  configs:
    - {label: "off", enabled: false}
    - {label: "on", probes: /Users/mkiyer/Downloads/rigel_runs/suite/reference/capture_panel.tsv}

oracle_bam: true

# ⭐ No FASTQs. Nothing under scripts/design/ or src/rigel/calibration/ opens one, and they are
# half a panel's on-disk size. ⛔ scripts/benchmarking/ DOES read them — this panel cannot be handed
# to a third-party tool comparison without re-simulating.
emit_fastq: false
verbose: true
