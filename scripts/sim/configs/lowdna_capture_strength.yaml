# LOW-DNA × CAPTURE-STRENGTH study — validates the aggregate DNA-background reference (background_reference_
# derivation.md §8) degrades GRACEFULLY as hybrid capture depletes the intergenic/intron floor at REALISTIC low
# DNA levels (1-5%), where the current 100/300% scenarios cannot see the failure.
#
# Grid = 4 gDNA × 3 capture × 1 strand × 1 nascent = 12 conditions (unstranded + nascent-present = the hard,
# realistic case). Reuses the ambig_dense_10mb reference + probes via --skip-existing (only the NEW conditions
# run; gdna_none/gdna100 × off/on at ss0.50 nrna present already exist and are skipped).
#   gDNA:    none (0) + gdna1 (1%) + gdna5 (5%) + gdna100 (1:1 anchor)
#   capture: off (no enrichment) + on (binding=10, standard) + verystrong (binding=60, off_target=0.15 = deep
#            off-target depletion → the "floor looks like zero" regime the owner flagged)
#
# Usage:  python scripts/sim/simulate_suite.py --config <this> --skip-existing

suite:
  outdir: /Users/mkiyer/Downloads/rigel_runs/ambig_dense_10mb
  genome_length: 10570533
  n_genes: 100
  min_isoforms: 1
  max_isoforms: 3
  target_transcripts: null
  antisense_fraction: 0.5
  seed: 20260706
  profile: smoke

simulation:
  n_rna_fragments: 2000000
  frag_mean: 200
  frag_std: 0
  frag_min: 100
  frag_max: 300
  read_length: 100
  error_rate: 0.0
  n_workers: 16

abundance:
  seed: 20260707
  min: 1.0
  max: 10000.0
  frac_expressed: 1.0

gdna:
  rates:       [0.0,  0.01,   0.05,  1.0]
  rate_labels: [none, gdna1,  gdna5, gdna100]
  frag_mean: 100
  frag_std: 0
  frag_min: 50
  frag_max: 150

strand_specificities: [0.50]

nrna:
  mode: additive_ratio
  ratios:       [0.5]
  ratio_labels: [present]

capture:
  probe_length: 120
  probe_density: 0.5
  off_target_weight: 1.0
  binding_per_base: 10.0
  gdna_split_penalty: 0.2
  min_overlap: 1
  configs:
    - label: off
      enabled: false
    - label: on
      fraction: 0.5
    - label: verystrong
      fraction: 0.5
      binding_per_base: 60.0
      off_target_weight: 0.15
