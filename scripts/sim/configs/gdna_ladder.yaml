# ════════════════════════════════════════════════════════════════════════════════════════════════
#  THE gDNA LADDER — the debug/optimisation panel. EQUAL fragment lengths, full gDNA spectrum.
# ════════════════════════════════════════════════════════════════════════════════════════════════
#
# ⭐⭐ WHAT THIS PANEL IS FOR. This one exists to debug and optimise CALIBRATION — the focus of the
# 0.8.0 release, whose metric is the CALIBRATION RESULT scored against ORACLE CALIBRATION and not the
# end-to-end transcript number (owner, 2026-08-14). `docs/SUCCESS.md` carries the metric.
#
# ⛔⛔ WHY BOTH ORIGINS GET THE SAME LENGTH DISTRIBUTION — AND THE REASON IS STRONGER THAN THE ONE
# THIS FILE USED TO GIVE. It used to say only that "the length channel is a confound rather than a
# signal, so any residual error is attributable to density and strand". That is a CONSEQUENCE, and
# stated alone it reads as tidiness. THE EM ALREADY USES THE FRAGMENT-LENGTH DISTRIBUTION —
# `scoring.cpp` carries TWO length tables, `fl_log_prob_` for RNA and `gdna_fl_log_prob_` for gDNA —
# so a large gDNA-vs-RNA length gap lets the EM split the two origins on LENGTH ALONE, BYPASSING
# calibration entirely and MASKING its bugs, and the panel then reads green with calibration broken.
# Equal lengths remove that shortcut and FORCE the calibration phase to be exercised, leaving it
# strand and density (plus belief propagation across objects, which is currently off).
#
# ⛔⛔ AND THE FRAGMENT-LENGTH CHANNEL IS NOT COMING BACK BEFORE 0.8.0. This paragraph used to end
# "clean the noise up first, exactly as the accumulator was, and add the fragment-length channel back
# afterwards as an additional signal" (owner, 2026-08-03). SUPERSEDED: the fragment-length / "length
# likelihood" channel AS A CALIBRATION COMPOSITION CHANNEL is DEFERRED POST-0.8.0 (owner,
# 2026-08-14). 0.8.0 ships without it; do not propose it, list it as a candidate or rank it.
# ⚠ It does not exist in `src/` — it was A/B'd once on 2026-08-10 and never shipped.
# ⚠ `length_likelihood` in `src/rigel/second_pass.py` is a DIFFERENT thing (per-fragment second-pass
# assignment) and is untouched by that ruling.
#
# ⭐⭐ **16 CONDITIONS, NOT 36 — REBUILT FROM SCRATCH 2026-08-13, AND EVERY AXIS THAT WAS DROPPED WAS
# PRICED FIRST.** The 9-rung ladder cost 27 G and five of its rungs bought nothing the other four did
# not. What may NOT be dropped, each for a measured reason:
#
#   · **`g00`, the ZERO-gDNA control** — owner-required on every experiment. Its truth is exactly 0,
#     so every deviation is a false positive with nothing to cancel it. `ISSUES.md`'s CLOSED / REFUSED graveyard
#     is eleven mechanisms that looked good on their target and died here.
#   · **unstranded × capture-ON, the DEFERRED stratum** — **64.5 % of transcript error and 90 % of
#     gene-level error** (measured 2026-08-13/14 on this panel; the "~73 %" once recorded here was
#     the retired 36-condition ladder's figure). ⛔⛔ DEFERRED IS NOT DROPPED (owner, 2026-08-14):
#     it is not a 0.8.0 development target until the three IN-SCOPE strata — unstranded × capture-OFF,
#     stranded × capture-OFF, stranded × capture-ON — are fully optimised, but it REMAINS in every
#     benchmark and must keep being reported. A panel without it cannot see the thing the tool is
#     worst at, and it is the one cell where a mechanism that helps everywhere else can hide a
#     catastrophe. ⛔ Read it PER STRATUM: a pooled total is mostly this cell and ranks nothing.
#   · **at least THREE gDNA levels** — `TRAPS: a-single-level-panel-cannot-see-a-constant`. A channel
#     that returns a near-CONSTANT scores well on a single-level panel and is refuted the moment a
#     second level exists. That trap cost a whole analysis.
#   · ⛔ **`g05`, and it is here because an instrument demanded it.** `suite_resolves.py`'s
#     requirement (f) is `0 < gdna_rate <= 0.10 WITH capture on`, degenerate value 0 conditions —
#     "real libraries live at 1-10 % gDNA". A `{g00, g50, g98}` panel scores the degenerate value
#     EXACTLY and the instrument exits non-zero. ⚠ Note the test is on the RATE, not on `f_gdna`:
#     the retired ladder's `g10` had rate 0.111 and did NOT qualify either. Owner ruling 2026-08-13:
#     add the rung rather than record a second known-failing requirement.
#
# ⚠ **"EQUAL" IS A CONFIGURATION, NOT A GUARANTEE — AND IT IS MEASURED, NOT ASSUMED.** Identical
# parameters for both origins still leave a realised gap, because an mRNA fragment must fit inside
# its transcript and gDNA need not: transcript-length truncation pulls the RNA mean down while gDNA
# keeps the bare truncated-normal mean. Measured on this exact configuration at 400 k fragments:
#
#     capture off   gDNA 216.67-216.90   RNA 212.66-213.14   gap +3.56 to +4.09 bp  (~+1.9 %)
#     capture on    gDNA 240.40-240.60   RNA 229.23-229.62   gap +10.81 to +11.25 bp (~+4.8 %)
#
# ⚠ RE-MEASURED 2026-08-22 on the rebuilt (sparse-nascent) panel, from every condition's
# `truth_summary.json`. The capture-OFF gap is essentially unchanged; the capture-ON gap is ~3x the
# +3.57 bp this table used to claim, and that discrepancy is NOT attributable to the sparse rebuild
# (capture length selection did not change and the old panel is gone) — treat the old figure as
# having been stale. ⭐ Nascent fragments run ~4.7 bp LONGER than mature (216.5 vs 211.8 off capture)
# because a nascent span is not transcript-truncated, so the RNA mean is a mixture whose weights the
# nascent model sets.
#
# ⭐ And what that residual is WORTH was measured before accepting it, one thing varied (both pmfs
# replaced by their pooled average, so the gap is exactly zero): the per-object mass-weighted error
# moves by **−0.0002** off capture and **−0.0054** under it, against a mwae of 0.2169 — under 2.5 %
# of the error, with a *fitted* gap 3–5x larger than the true residual. Owner ruling: carry it.
# ⛔ Score the length axis against `truth_fragment_lengths.tsv`, never against the numbers above.
#
# ⭐⭐ THE DEPTH MODEL IS `n_total_fragments`, NOT `n_rna_fragments`, AND THAT IS THE POINT. Under the
# rate model gDNA is added ON TOP of a fixed RNA depth, so a 98 % gDNA library is `rate = 49` —
# 490 M fragments. Here the TOTAL is fixed and the rate decides only the SPLIT
# (`rigel.sim.orchestrator.resolve_depths`, gated by `tests/test_sim_fixed_total_depth.py`). That is
# also the faithful model: a sequencing run has a fixed budget and contamination decides how it is
# divided. ⚠ Accepted trade-off (owner): the RNA side thins as gDNA rises, so per-transcript
# abundance accuracy degrades at the top of the ladder. That is a property of such libraries.
#
# ⛔ REAL LIBRARIES SPAN THE WHOLE RANGE — from almost zero gDNA to >98 % of all fragments — and
# Rigel must be robust across all of it. The ladder is `f_gdna = rate/(1+rate)`:
#
#     rate    0.0     0.052632    1.0     49.0
#     f_gdna  0 %        5 %      50 %    98 %
#     n_rna   10.0 M    9.50 M    5.0 M   0.20 M
#
# ⛔⛔ THE FOCUS IS NO LONGER `ss_0.50 + capture_on`, AND THAT IS AN OWNER RULING (2026-08-14). This
# file used to read "THE FOCUS CONDITION IS `ss_0.50 + capture_on` (owner). It is where the error is
# largest and it is the one to optimise; the stranded and capture-off cells are CONTROLS that must
# not regress" — retained here as the record of what the focus used to be. SUPERSEDED: `ss_0.50 +
# capture_on` is the UNSTRANDED half of the strand axis and is the one DEFERRED stratum, so the three
# in-scope cells are the development targets and this one is reported rather than ranked.
# ⚠ Largest error is exactly why it needed a ruling rather than a follow-the-error loop: the tool's
# answer there is FLAT, not noisy, so an optimiser overfits it rather than fixing it.
# ⛔ The `f_gdna = 0` rung remains the false-positive check on every stratum, in scope or not, and
# it is still true that you do not tune on a control.
#
# ⛔⛔ **THE INDEX IS BUILT `--no-mappability`, AND THAT IS A RULING, NOT AN OMISSION** (owner,
# 2026-08-13). An alignable store is on disk and covers every contig here, but per-region mappability
# was removed in v0.5.0 and SRD calibration does not consume it (`src/rigel/index.py`), so the store's
# ONLY live effect is the sj artifact blacklist — which collides with **23.3 % of this reference's
# annotated junctions** (3,147 of 13,482 at the default `min_count=2`). The scanner's rule is OR: drop
# the sj if EITHER anchor is inside the envelope. On a zero-error simulated panel there are no
# artifacts to catch, so the filter can only create FALSE NEGATIVES — ~2.0 % of truly-spliced reads
# silently reclassified as UNSPLICED and 72 junctions silenced outright, which perturbs precisely the
# spliced/unspliced split this panel exists to measure. ⚠ Raising `min_count` does not separate them:
# the fully-dark set survives to `min_count=250`.
#
# Build the inputs first (shared reference and probes):
#   python scripts/sim/build_suite_reference.py --fasta genome_controls.fasta.bgz \
#       --gtf genes_controls.sorted.gtf --refs chr21 chr22 --ercc -o <suite>/reference
#   python scripts/sim/design_suite_probes.py --gtf <suite>/reference/genes.gtf \
#       -o <suite>/reference/capture_panel.tsv --capture-fraction 0.5
#
# Run:  python scripts/sim/panel.py status --config scripts/sim/configs/gdna_ladder.yaml

genome: /Users/mkiyer/Downloads/rigel_runs/suite/reference/genome.fa
gtf: /Users/mkiyer/Downloads/rigel_runs/suite/reference/genes.gtf
# ⭐ THE TRANSCRIPTOME THE SIMULATION DRAWS FROM — the same index `rigel quant` will read, so the
# synthetic nascent-RNA entities are identical on both sides (owner, 2026-08-19). `panel.py build`
# creates it; without this key one is built into `<outdir>/rigel_index`.
index: /Users/mkiyer/Downloads/rigel_runs/suite/rigel_index
outdir: /Users/mkiyer/Downloads/rigel_runs/suite/ladder
transcript_filter: all

# ── Read simulation ─────────────────────────────────────────────────────────────────────────────
# ⚠ `n_total_fragments` is what governs; `n_rna_fragments` is ignored in this mode and is left at
# the same value only so the file reads sensibly if the total is ever removed.
simulation:
  n_total_fragments: 10000000
  n_rna_fragments: 10000000
  sim_seed: 42
  # ⭐ REALISTIC AND IDENTICAL TO THE gDNA BLOCK BELOW. Real fragments run ~50 bp to ~500 bp with
  # little above that (owner). The mean and sd are MO_3021's measured RNA pool. ⛔ All four must
  # match, not just the mean: a different support is itself a gap.
  frag_mean: 206
  frag_std: 98
  frag_min: 50
  frag_max: 500
  read_length: 100
  error_rate: 0.0
  n_workers: 8

# ── Abundance ───────────────────────────────────────────────────────────────────────────────────
abundance:
  mode: random
  seed: 42
  min: 1.0
  max: 10000.0
  frac_expressed: 0.5

# ── gDNA: the ladder ────────────────────────────────────────────────────────────────────────────
gdna:
  rates:       [0.0, 0.052632, 1.0, 49.0]
  rate_labels: [g00, g05,      g50, g98]
  # ⛔ "Has an annotation" is not "is genomic" — every ERCC reference carries one transcript, so
  # inferring this from the annotation once filled a panel with gDNA on RNA-only spike-ins, on the
  # very templates whose truth abundance of zero is the false-positive control. State it.
  genomic_refs: [chr21, chr22]
  # ⭐⭐ IDENTICAL to `simulation` above. This is the whole point of the panel.
  frag_mean: 206
  frag_std: 98
  frag_min: 50
  frag_max: 500

# ── Strand ──────────────────────────────────────────────────────────────────────────────────────
# ⚠ 0.50 is the focus, not merely the hard case: at kappa = 1/2 the strand likelihood carries
# EXACTLY zero information about the gDNA fraction, for any count and any overdispersion, so the
# unstranded cells isolate the density channel completely.
strand_specificities: [0.50, 0.99]

# ── Nascent: ALWAYS ON, SPARSE, AND NO LONGER AN AXIS ───────────────────────────────────────────
# ⭐⭐⭐ NASCENT RNA IS SPARSE — ABSENT FROM MOST GENE SPANS, PRESENT AND MEASURABLE IN A MINORITY
# (owner, 2026-08-22; `DESIGN.md` §0b, THE NASCENT SCOPE RULING). This replaced a GLOBAL molar ratio
# applied to every multi-exon transcript, which put nascent everywhere at one level and made the tool
# be designed AROUND nascent rather than robust TO it.
#
# ⭐ THE THREE PROPERTIES, each gated in `tests/test_whole_genome_sim_config.py`:
#   ① the on/off draw is PER GENE SPAN (the nascent entity), never per transcript — isoforms share a
#     span, so a per-transcript draw would make a 5-isoform gene 1 − 0.9^5 = 41 % likely to carry
#     nascent at on_fraction 0.1, and the INTRON slots calibration reads would be four times less
#     sparse than configured;
#   ② the level is LOG-UNIFORM over the range — where nascent is present it spans decades, and a
#     linear draw on (1, 100) would put 90 % of its mass in the top decade;
#   ③ ⭐⭐ the level is ABSOLUTE and INDEPENDENT of the mature level, so `nascent > mature` is a real
#     case the tool must survive. The steady state says this is the right null: mature is
#     synthesis/degradation and nascent is synthesis, so the ratio is a STABILITY parameter rather
#     than an expression one.
#
# ⛔⛔ THE 0.50 on_fraction IS A DEVELOPMENT STRESS LEVEL AND IS NOT REAL DATA (owner, 2026-08-22):
# *"for the sake of stressing the tool and ensuring robustness … any calibration development will
# suffer if it does not correctly model nascent RNA. This is the way we build a robust tool. BUT
# remember, this is not real data."* A realistic setting is on_fraction ≈ 0.10, which the same range
# prices at a 4.2 % fragment share.
#
# ⭐ THE FRAGMENT SHARE IS EMERGENT, and it was PRICED on this index before the panel was rebuilt
# (`expected_rna_weights`, the same function `fragment_share` inverts): on_fraction 0.50 × logU(1, 100)
# ⇒ 1,916/3,662 spans on, molar ratio 0.00895, **20.2 % of RNA fragments**. ⭐⭐ That is the same total
# nascent burden as the retired uniform 20 % model, distributed SPARSELY — so a behaviour change
# between the two panels is attributable to the DISTRIBUTION and not to the amount.
# ⚠ The label stays `mid`: it names the CONDITION, and 25 instruments default to `nrna_mid`.
nrna:
  mode: sparse
  abundance_ranges: [[1.0, 100.0]]
  on_fraction: 0.50
  ratio_labels: [mid]

# ── Capture ─────────────────────────────────────────────────────────────────────────────────────
capture:
  probe_format: transcript
  off_target_weight: 1.0
  binding_per_base: 10.0
  gdna_split_penalty: 0.2
  min_overlap: 1
  configs:
    - {label: "off", enabled: false}
    - {label: "on", probes: /Users/mkiyer/Downloads/rigel_runs/suite/reference/capture_panel.tsv}

oracle_bam: true
verbose: true
