# ════════════════════════════════════════════════════════════════════════════════════════════════
#  THE gDNA LADDER — the 16-condition panel the tool is ranked on. Equal fragment lengths, full gDNA range.
# ════════════════════════════════════════════════════════════════════════════════════════════════
#
# Four gDNA rungs × two strand specificities × capture off / on, at one sparse nascent setting. Every score is
# read per stratum (strandedness × capture), never pooled.
#
# Both origins get the same fragment-length distribution. The EM scores length with two tables, one for RNA and
# one for gDNA, so a length gap would let it split the origins on length alone, bypass calibration and mask
# its bugs. Equal lengths force calibration to do the separation from strand and density.
#
# Equal is a configuration, not a guarantee: an RNA fragment must fit inside its transcript and gDNA need not,
# so truncation pulls the RNA mean down, capture's length selection widens the gap, and nascent fragments
# (not transcript-truncated) run longer than spliced ones. Read the realised lengths from each condition's
# `truth_fragment_lengths.tsv`, never from this file.
#
# What every axis is for:
#   · `g00`, the zero-gDNA control: its truth is exactly 0, so every gDNA call is a false positive with
#     nothing to cancel it. It is the false-positive check on every stratum.
#   · unstranded × capture-ON is the deferred stratum: not a development target, but reported on every
#     benchmark, since it is where the tool is worst and where a mechanism that helps elsewhere can hide a
#     catastrophe. Read it on its own; a pooled total is mostly this cell.
#   · at least three gDNA levels: a channel that returns a near-constant scores well at a single level and is
#     refuted as soon as a second exists.
#   · `g05`, the low-gDNA × capture-on corner where real libraries live (0 < rate ≤ 0.10 with capture on).
#
# The depth model fixes `n_total_fragments` and lets the rate decide only the split
# (`rigel.sim.orchestrator.resolve_depths`, gated by `tests/test_sim_fixed_total_depth.py`), as a sequencing run
# has a fixed budget that contamination divides. The RNA side thins as gDNA rises, so per-transcript accuracy
# degrades at the top of the ladder; that is a property of such libraries. With f_gdna = rate / (1 + rate):
#
#     rate    0.0     0.052632    1.0     49.0
#     f_gdna  0 %        5 %      50 %    98 %
#     n_rna   10.0 M    9.50 M    5.0 M   0.20 M
#
# The index is built `--no-mappability`. Calibration does not read mappability, so the alignable store's only
# effect would be the junction artifact blacklist, which drops a junction when either anchor sits inside the
# envelope. On a simulated panel there are no artifacts to catch, so the blacklist could only reclassify truly
# spliced reads as unspliced, perturbing the spliced / unspliced split this panel measures.
#
# Build the inputs first (shared reference and probes):
#   python scripts/sim/build_suite_reference.py --fasta genome_controls.fasta.bgz \
#       --gtf genes_controls.sorted.gtf --refs chr21 chr22 --ercc -o <suite>/reference
#   python scripts/sim/design_suite_probes.py --gtf <suite>/reference/genes.gtf \
#       -o <suite>/reference/capture_panel.tsv --capture-fraction 0.5
#
# Run:  python scripts/sim/panel.py status --config scripts/sim/configs/gdna_ladder.yaml

genome: $RIGEL_RUNS/suite/reference/genome.fa
gtf: $RIGEL_RUNS/suite/reference/genes.gtf
# the transcriptome the simulation draws from is the index `rigel quant` reads, so the synthetic nascent
# entities are identical on both sides. `panel.py build` creates it; without this key one is built into
# `<outdir>/rigel_index`.
index: $RIGEL_RUNS/suite/rigel_index
outdir: $RIGEL_RUNS/suite/ladder

# no FASTQs: every scorer reads the oracle BAM and `panel.py` finds a condition by `sim_oracle.bam`;
# `panel.py align`, the one stage that reads them, rebuilds a pair from the oracle BAM byte for byte
# (`samtools fastq -N`) and deletes it once aligned.
emit_fastq: false

# ── Read simulation ─────────────────────────────────────────────────────────────────────────────
# `n_total_fragments` governs; `n_rna_fragments` is ignored in this depth mode.
simulation:
  n_total_fragments: 10000000
  n_rna_fragments: 10000000
  sim_seed: 42
  # realistic (about 50–500 bp; the mean and sd of a real cfRNA library's RNA pool) and identical to
  # the gdna block below. All four values must match, since a different support is itself a gap.
  frag_mean: 206
  frag_std: 98
  frag_min: 50
  frag_max: 500
  read_length: 100
  # substitutions per base, about an Illumina run's: the oracle BAM places every read by truth and records
  # its NM; an aligner's input carries the errors as sequenced reads do
  error_rate: 0.002
  n_workers: 8

# ── Abundance ───────────────────────────────────────────────────────────────────────────────────
abundance:
  mode: random
  seed: 42
  min: 1.0
  max: 10000.0
  frac_expressed: 0.5

# ── gDNA: the ladder ────────────────────────────────────────────────────────────────────────────
gdna:
  rates:       [0.0, 0.052632, 1.0, 49.0]
  rate_labels: [g00, g05,      g50, g98]
  # stated, never inferred from the annotation: every ERCC reference carries one transcript, and gDNA on
  # the RNA-only spike-ins would land on the templates whose zero truth is a false-positive control
  genomic_refs: [chr21, chr22]
  frag_mean: 206
  frag_std: 98
  frag_min: 50
  frag_max: 500

# ── Strand ──────────────────────────────────────────────────────────────────────────────────────
# At 0.50 the strand likelihood carries no information about the gDNA fraction, for any count and any
# overdispersion, so the unstranded cells isolate the density channel.
strand_specificities: [0.50, 0.99]

# ── Nascent: always on and sparse ───────────────────────────────────────────────────────────────
# Nascent RNA is absent from most gene spans and present in a minority, so the tool is built robust to it
# rather than around it. Three properties, each gated in `tests/test_whole_genome_sim_config.py`:
#   ① the on/off draw is per gene span (the nascent entity), never per transcript: isoforms share a span,
#     and a per-transcript draw would make a 5-isoform gene 1 − 0.9^5 = 41 % likely to carry nascent at
#     on_fraction 0.1, leaving the intron slots far less sparse than configured;
#   ② the level is log-uniform over the range: where nascent is present it spans decades, and a linear
#     draw on (1, 100) would put 90 % of its mass in the top decade;
#   ③ the level is absolute and independent of the mature level, so nascent > mature is a real case. Mature
#     is synthesis / degradation and nascent is synthesis, so their ratio is a stability parameter.
# on_fraction 0.50 is a development stress level, not real data (a realistic setting is about 0.10). The
# fragment share is emergent: on_fraction 0.50 × logU(1, 100) puts about a fifth of the RNA fragments in
# nascent RNA on this index. The label `mid` names the condition and must stay: instruments default to
# `nrna_mid`.
nrna:
  mode: sparse
  abundance_ranges: [[1.0, 100.0]]
  on_fraction: 0.50
  ratio_labels: [mid]

# ── Capture ─────────────────────────────────────────────────────────────────────────────────────
capture:
  probe_format: transcript
  off_target_weight: 1.0
  binding_per_base: 10.0
  min_overlap: 1
  configs:
    - {label: "off", enabled: false}
    - {label: "on", probes: $RIGEL_RUNS/suite/reference/capture_panel.tsv}

oracle_bam: true
verbose: true
