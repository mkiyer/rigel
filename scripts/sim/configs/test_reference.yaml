# ════════════════════════════════════════════════════════════════════════════════════════════════
#  THE METHOD-DEVELOPMENT SCENARIOS — the test chromosome, swept over the axes that matter
# ════════════════════════════════════════════════════════════════════════════════════════════════
#
# Message policies are developed on the test chromosome (`test_reference/`). This config sweeps it over the same
# axes as the gDNA ladder at a depth that simulates in seconds, so a change is scored end to end inside the
# development loop. The transcripts, abundances and probes are not here: `test_reference/test_chr.yaml` is the
# one hand-edited source, `build_test_reference.py` renders the GTFs, the abundance TSV and the probe panels from
# it, and the FASTA, the index and this sweep are derived (docs/TESTING.md §0a).
#
# There is no `nascent:` block: under `abundance.mode: file` the TSV's `nascent_abundance` column is the only source of
# nascent weight, so the nascent sweep is skipped and every condition is labelled `nascent_file`.
#
# Two axes live in the substrate rather than here. Capture: under `capture: on` about half the genes are probed
# and the rest have no probe, so every condition holds both captured and uncaptured structures. Nascent: only the
# twin block's `nasc` / `capnasc` types carry nascent RNA, from ten times above to a thousand times below mature,
# so a reader knows which structure carries it.

genome: $RIGEL_RUNS/test_reference/test_chr.fa
gtf: $RIGEL_RUNS/test_reference/test_chr.gtf
# unannotated transcription on the blank chromosome `test_blank`: simulated, never given to the index
shadow_gtf: $RIGEL_RUNS/test_reference/test_shadow.gtf
index: $RIGEL_RUNS/test_reference/idx
outdir: $RIGEL_RUNS/test_reference/scenarios

# no FASTQs: every scorer reads the oracle BAM, and `panel.py` finds a condition by `sim_oracle.bam`
emit_fastq: false

simulation:
  # small on purpose: the development loop runs in seconds
  n_total_fragments: 1170000
  n_rna_fragments: 1170000
  sim_seed: 42
  # must equal the gdna block's lengths, so the EM cannot split the origins on length alone and
  # calibration is what gets exercised
  frag_mean: 206
  frag_std: 98
  frag_min: 50
  frag_max: 500
  read_length: 100
  error_rate: 0.0
  n_workers: 8

abundance:
  mode: file
  file: $RIGEL_RUNS/test_reference/test_abundances.tsv

gdna:
  # five gDNA rungs: 0, 5 %, 25 %, 50 % and 98 % of fragments (the rate is f/(1-f), so 25 % is 0.333333).
  # g00's truth is exactly 0, so every gDNA fragment reported there is a false positive; g98 holds the
  # near-vertex population; g05 and g25 sit in the sparse and the balanced regimes.
  rates:       [0.0, 0.052632, 0.333333, 1.0, 49.0]
  rate_labels: [g00, g05,      g25,      g50, g98]
  genomic_refs: [test_chr, test_blank]   # gDNA is drawn on the blank chromosome too
  frag_mean: 206
  frag_std: 98
  frag_min: 50
  frag_max: 500

# 0.50 is unstranded: the strand channel is dead and density is all there is, so message passing must
# win against silence. 0.99 is stranded: the local solve is strong, so the bar is minimal harm. 0.70
# sits between and shows whether a policy degrades gracefully.
strand_specificities: [0.50, 0.70, 0.99]

capture:
  probe_format: bed12
  off_target_weight: 1.0
  binding_per_base: 10.0
  min_overlap: 1
  configs:
    - {label: "off", enabled: false}
    - {label: "on", probes: $RIGEL_RUNS/test_reference/test_probes.bed}

oracle_bam: true
verbose: true
