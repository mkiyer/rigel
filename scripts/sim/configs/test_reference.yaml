# ════════════════════════════════════════════════════════════════════════════════════════════════
#  THE METHOD-DEVELOPMENT SCENARIOS — the test chromosome, swept over the axes that matter
# ════════════════════════════════════════════════════════════════════════════════════════════════
#
# ⭐⭐⭐ WHAT THIS IS. The message-propagation policy is developed against `test_reference/` — a
# 1 Mb chromosome that grows ONE TRANSCRIPT AT A TIME (owner, 2026-08-19). This config sweeps that
# reference over the same axes as the big ladder, at a depth that simulates in seconds, so a policy
# change can be scored end to end in the development loop rather than on a 23 GB panel.
#
# ⛔ THE TRANSCRIPTS AND THEIR ABUNDANCES ARE NOT HERE. They are `test_reference/test_chr.gtf` and
# `test_reference/test_abundances.tsv`, both hand-edited; the FASTA and this sweep are derived.
# `docs/TESTING.md` §0a.
#
# ⚠ THE `nrna:` BLOCK BELOW IS DEAD BY DESIGN under `abundance.mode: file`: the TSV's
# `nrna_abundance` column is the ONE source of nascent weight, pooled onto the index's nascent
# entities, so the sweep is skipped and every condition is labelled `nrna_file`. It is INERT — editing
# its numbers changes nothing, and it is retained only so the file reads like the other panel configs.
#
# ⭐⭐⭐ THE NASCENT PATTERN IN THE TSV IS SPARSE AND HAND-AUTHORED (rewritten 2026-08-22). It used to be
# a flat 10 on every multi-exon transcript — one level everywhere, which is the uniform model the owner
# retired (`DESIGN.md` §0b, THE NASCENT SCOPE RULING). It is now **4 of the 9 multi-exon spans ON, at
# 3 / 30 / 30 / 300, against a mature abundance of 100 on every transcript** — so most spans have an
# EXACTLY nascent-free intron, one span carries three times more nascent than mature, and the levels
# span two decades. The four are `T9a_2exon_3KB` (3), `T4_cap_2exon_2KB` (30), `TBp_2exon_3900BP` (30)
# and `T6_3exon_3KB` (300).
#
# ⭐⭐ WHY HAND-AUTHORED HERE RATHER THAN DRAWN, and the reason is diagnostic rather than stylistic. The
# big ladder uses `nrna.mode: sparse`, a Bernoulli-plus-log-uniform DRAW, because it has 3,662 gene
# spans and the DISTRIBUTION is the thing under test there. This chromosome has 9, where a draw is
# mostly sampling noise: it would leave the ON set at the mercy of a seed, and it would move every ON
# span the next time a transcript is added. ⛔ The whole point of a 28-transcript debug substrate is
# that you know WHICH structure carries nascent RNA before you read a number off it — so the pattern
# is written down, one span at a time, next to the transcript it belongs to. It is chosen to exercise
# the properties the ladder's draw produces statistically: nascent absent, nascent present, nascent
# spanning decades, and nascent EXCEEDING mature.

genome: /Users/mkiyer/Downloads/rigel_runs/test_reference/test_chr.fa
gtf: /Users/mkiyer/Downloads/rigel_runs/test_reference/test_chr.gtf
index: /Users/mkiyer/Downloads/rigel_runs/test_reference/idx
outdir: /Users/mkiyer/Downloads/rigel_runs/test_reference/scenarios

simulation:
  # ⭐ small on purpose — the point of this reference is a SECONDS-long loop
  n_total_fragments: 200000
  n_rna_fragments: 200000
  sim_seed: 42
  # ⛔ IDENTICAL to the gdna block below: equal fragment lengths force calibration to be exercised
  # rather than letting the EM split the origins on length alone (`docs/TESTING.md` §0).
  frag_mean: 206
  frag_std: 98
  frag_min: 50
  frag_max: 500
  read_length: 100
  error_rate: 0.0
  n_workers: 8

abundance:
  mode: file
  file: /Users/mkiyer/Downloads/rigel_runs/test_reference/test_abundances.tsv

gdna:
  # ⭐ the zero control and three contaminated rungs, matching the big ladder's spectrum. `g00`'s
  # truth is exactly 0, so every gDNA fragment the tool reports there is a false positive with
  # nothing to cancel it. ⭐ `g05` and `g98` were added 2026-08-20, each justified by a measured
  # transition on the ladder that the g00/g50 grid could not represent: the near-vertex population
  # (true f_g ≥ 0.999) exists only at g98 and carries ~60-65 % of the Silent frontier there, and
  # the reference-mean blocker is measured at g05 (a truth-fed library-wide mean reads 2.65x WORSE
  # at g05 stranded x capture-ON while melting g98's vertex population 0.029x — opposite ends,
  # so interpolation from g50 sees neither).
  rates:       [0.0, 0.052632, 1.0, 49.0]
  rate_labels: [g00, g05,      g50, g98]
  genomic_refs: [test_chr]
  frag_mean: 206
  frag_std: 98
  frag_min: 50
  frag_max: 500

# ⭐ unstranded and stranded: on unstranded data the strand channel is dead and the density channel
# is all there is, which is where message propagation has to carry the answer.
strand_specificities: [0.50, 0.99]

# ⛔ INERT under `abundance.mode: file` — the nascent weights come from `test_abundances.tsv` and its
# hand-authored sparse pattern (the header). Do not "fix" nascent RNA by editing this block.
nrna:
  mode: fragment_share
  shares:       [0.0]
  ratio_labels: [none]

capture:
  probe_format: bed12
  off_target_weight: 1.0
  binding_per_base: 10.0
  gdna_split_penalty: 0.2
  min_overlap: 1
  configs:
    - {label: "off", enabled: false}
    - {label: "on", probes: /Users/mkiyer/Downloads/rigel_runs/test_reference/test_probes.bed}

oracle_bam: true
verbose: true
