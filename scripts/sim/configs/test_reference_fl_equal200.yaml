# The fragment-length side arm with equal lengths: `test_reference.yaml` with both fragment-length blocks at
# 200 ± 100, a near-replicate of the base arm's 206 ± 98 and so its noise floor. Only the two length blocks and
# `outdir` differ. A configured mean is not a realised one: read the lengths from each condition's
# truth_fragment_lengths.tsv.

genome: $RIGEL_RUNS/test_reference/test_chr.fa
gtf: $RIGEL_RUNS/test_reference/test_chr.gtf
shadow_gtf: $RIGEL_RUNS/test_reference/test_shadow.gtf
index: $RIGEL_RUNS/test_reference/idx
outdir: $RIGEL_RUNS/test_reference/scenarios_fl_equal200

emit_fastq: false

simulation:
  n_total_fragments: 1170000
  n_rna_fragments: 1170000
  sim_seed: 42
  frag_mean: 200
  frag_std: 100
  frag_min: 50
  frag_max: 500
  read_length: 100
  error_rate: 0.0
  n_workers: 8

abundance:
  mode: file
  file: $RIGEL_RUNS/test_reference/test_abundances.tsv

gdna:
  rates:       [0.0, 0.052632, 0.333333, 1.0, 49.0]
  rate_labels: [g00, g05,      g25,      g50, g98]
  genomic_refs: [test_chr, test_blank]   # gDNA is drawn on the blank chromosome too
  frag_mean: 200
  frag_std: 100
  frag_min: 50
  frag_max: 500

strand_specificities: [0.50, 0.70, 0.99]

capture:
  probe_format: bed12
  off_target_weight: 1.0
  binding_per_base: 10.0
  min_overlap: 1
  configs:
    - {label: "off", enabled: false}
    - {label: "on", probes: $RIGEL_RUNS/test_reference/test_probes.bed}

oracle_bam: true
verbose: true
