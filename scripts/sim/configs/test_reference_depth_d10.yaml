# The gDNA-depth ladder at d10: `test_reference.yaml` at a tenth of its depth (117 k fragments) over six gDNA
# rungs from 0 to 50 %, stranded only; everything else is identical. `ruler_vs_truth.py --panel-dir` reads
# the depth ladder as one operating curve.

genome: $RIGEL_RUNS/test_reference/test_chr.fa
gtf: $RIGEL_RUNS/test_reference/test_chr.gtf
shadow_gtf: $RIGEL_RUNS/test_reference/test_shadow.gtf
index: $RIGEL_RUNS/test_reference/idx
outdir: $RIGEL_RUNS/test_reference/scenarios_depth_d10

emit_fastq: false

simulation:
  n_total_fragments: 117000
  n_rna_fragments: 117000
  sim_seed: 42
  frag_mean: 206
  frag_std: 98
  frag_min: 50
  frag_max: 500
  read_length: 100
  error_rate: 0.0
  n_workers: 8

abundance:
  mode: file
  file: $RIGEL_RUNS/test_reference/test_abundances.tsv

gdna:
  rates:       [0.0, 0.001001, 0.010101, 0.052632, 0.333333, 1.000000]
  rate_labels: [g00, g001, g01, g05, g25, g50]
  genomic_refs: [test_chr, test_blank]   # gDNA is drawn on the blank chromosome too
  frag_mean: 206
  frag_std: 98
  frag_min: 50
  frag_max: 500

strand_specificities: [0.99]

capture:
  probe_format: bed12
  off_target_weight: 1.0
  binding_per_base: 10.0
  min_overlap: 1
  configs:
    - {label: "off", enabled: false}
    - {label: "on", probes: $RIGEL_RUNS/test_reference/test_probes.bed}

oracle_bam: true
verbose: true
