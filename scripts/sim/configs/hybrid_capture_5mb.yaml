# Hybrid-capture random mini-genome suite: 5 Mb, 100 genes, 1-5 isoforms/gene.
#
# Usage:
#   python scripts/sim/simulate_suite.py \
#     --config scripts/sim/configs/hybrid_capture_5mb.yaml
#
# Override outdir from the CLI for production runs:
#   python scripts/sim/simulate_suite.py \
#     --config scripts/sim/configs/hybrid_capture_5mb.yaml \
#     --outdir /scratch/$USER/rigel_sim/hybrid_capture_5mb

suite:
  outdir: /tmp/rigel_sim/hybrid_capture_5mb
  genome_length: 5000000
  n_genes: 100
  min_isoforms: 1
  max_isoforms: 5
  target_transcripts: null
  antisense_fraction: 0.0
  seed: 20260525
  profile: smoke
  conditions: null

simulation:
  n_rna_fragments: 1000000
  frag_mean: 250
  frag_std: 50
  frag_min: 80
  frag_max: 800
  read_length: 150
  error_rate: 0.0
  n_workers: 4

abundance:
  seed: 20260526
  min: 1.0
  max: 10000.0
  frac_expressed: 0.5

gdna:
  rates: [0.0, 0.1, 0.5]
  rate_labels: [none, low, high]
  frag_mean: 350
  frag_std: 100
  frag_min: 100
  frag_max: 1000

strand_specificities: [0.99, 0.50]

nrna:
  ratios: [0.0]
  ratio_labels: [none]

capture:
  probe_length: 120
  probe_density: 0.5
  off_target_weight: 1.0
  binding_per_base: 10.0
  gdna_split_penalty: 0.2
  min_overlap: 1
  configs:
    - label: off
      enabled: false
    - label: on
      fraction: 0.5
