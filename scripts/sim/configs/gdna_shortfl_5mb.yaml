# ════════════════════════════════════════════════════════════════════════
# SHORT-gDNA-FL variant of gdna_benchmark_5mb — IDENTICAL genome/transcripts/RNA
# (same seeds), ONLY the gDNA fragment-length distribution changed to a short,
# tight distribution (mean=100, std=20) realistic of degraded / cfDNA-like gDNA.
# Subset to the single flagship condition: gdna400 (4:1) × ss=0.99 × capture-on.
#
#   python scripts/sim/simulate_suite.py --config scripts/sim/configs/gdna_shortfl_5mb.yaml
# ════════════════════════════════════════════════════════════════════════

suite:
  outdir: /Users/mkiyer/Downloads/rigel_runs/gdna_shortfl_5mb
  genome_length: 5000000
  n_genes: 100
  min_isoforms: 1
  max_isoforms: 5
  target_transcripts: null
  antisense_fraction: 0.0
  seed: 20260608              # SAME seed → identical genome/transcripts/abundance
  profile: smoke

simulation:
  n_rna_fragments: 1000000
  frag_mean: 250
  frag_std: 50
  frag_min: 80
  frag_max: 800
  read_length: 150
  error_rate: 0.0
  n_workers: 12

abundance:
  seed: 20260609
  min: 1.0
  max: 10000.0
  frac_expressed: 0.5

# gDNA contamination — SHORT FL (the change under test).
gdna:
  rates:       [4.0]
  rate_labels: [gdna400]
  frag_mean: 100
  frag_std: 20
  frag_min: 50
  frag_max: 1000

strand_specificities: [0.99]   # stranded only (flagship condition)

nrna:
  ratios: [0.0]
  ratio_labels: [none]

capture:
  probe_length: 120
  probe_density: 0.5
  off_target_weight: 1.0
  binding_per_base: 10.0
  gdna_split_penalty: 0.2
  min_overlap: 1
  configs:
    - label: on
      fraction: 0.5
