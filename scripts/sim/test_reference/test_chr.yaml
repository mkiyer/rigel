# ═══════════════════════════════════════════════════════════════════════════════════════════════
#  THE METHOD-DEVELOPMENT TEST CHROMOSOME — the ONE hand-edited file (owner ruling, 2026-09-02)
# ═══════════════════════════════════════════════════════════════════════════════════════════════
#
# ⭐⭐⭐ THIS FILE IS THE BENCHMARK (owner, 2026-08-19): the test chromosome, its transcripts and their
# abundances comprise the method-development benchmark the message policy is developed against. It
# grows ONE STRUCTURE AT A TIME. Everything else in this directory — test_chr.gtf, test_shadow.gtf,
# test_abundances.tsv and the three probe panels — is RENDERED from this file by
# `scripts/sim/build_test_reference.py` (which also derives the two-contig FASTA with a splice motif
# at every declared intron); the suite gate `tests/test_test_reference_renders.py` refuses a render
# that drifted from the YAML. ⛔ Edit THIS file, then re-run the builder; never a render.
#
# THE SCHEMA is the `rigel sim` scenario schema (docs/MANUAL.md `rigel sim`; the toy harness's
# ToySpec uses the same `genes` shape), plus two keys it lacks:
#
#   genes:                         one entry per transcript GROUP (a gene)
#     - gene_id: gB1_clean
#       strand: "+"                ⭐ explicit, always; see the strand rule below
#       probed: false              ⭐ the capture panels are DESIGNED from this (benign / sparse / junction)
#       transcripts:
#         - {t_id: B1_clean, exons: [[20000, 21000], ...], abundance: 10, nrna_abundance: 0}
#   shadow_genes:                  transcripts on the BLANK contig `test_blank` — the SIMULATOR draws from
#                                  them and the INDEX never sees them (unannotated transcription)
#
# exons are 0-based HALF-OPEN [start, end) as in every `rigel sim` scenario (a GTF line reads
# start+1 .. end). `abundance` / `nrna_abundance` are RELATIVE MOLECULAR sampling weights (mature /
# nascent). Nascent RNA needs no declaration: `rigel index` creates a single-exon nascent ENTITY spanning
# each multi-exon transcript, and the simulator pools its contributor's nrna_abundance onto it. An
# annotated single-exon transcript is its own nascent-class entity, so its weight goes in `abundance`.
#
# ⭐ THE STRAND RULE (owner, 2026-09-02): every group has an explicit strand and the chromosome carries
# EQUAL representation of + and − (the builder refuses counts differing by more than one) — a sign error
# in any strand-dependent rule is invisible on a one-strand substrate. Strands here follow
# (type index + block) mod 2, so every TYPE appears on both strands across its five blocks. This is NOT
# the both-stranded locus (overlapping transcripts on opposite strands): that is a later step, and
# every gene here keeps its 20 kb intergenic spacer.
#
# ── THE ANCHORED TWIN BLOCK (owner design, 2026-08-28) ───────────────────────────────────────────
# ONE shape: exon 1 kb · intron 7 kb · exon 1 kb · intron 7 kb · exon 1 kb (span 17 kb), 20 kb
# intergenic between genes; FIVE gene types varying exactly one bit each × FIVE abundance blocks:
#   clean    unprobed, no nascent — intron + flanks exactly pure gDNA; one certified sj per intron
#   nasc     unprobed, nascent ON — the contaminated message source
#   cap      probed,   no nascent — the enrichment cliff between source and destination
#   capnasc  probed,   nascent ON — both at once
#   silent   probed,   mrna = 0  — every object pure gDNA; any claimed RNA is a false positive
# Molar ladders, half-decade steps, mature UP the blocks and nascent DOWN — independent levels, as the
# big ladder draws them: mrna 10/30/100/300/1000 (silent = 0), nrna 100/30/10/3/1 (nasc/capnasc only).
# In fragment terms the nascent entity spans 17 kb against 3 kb spliced, so the per-gene nascent:mature
# fragment ratio is ≈ 5.67·nrna/mrna = 57 / 5.7 / 0.57 / 0.057 / 0.0057 across the blocks; library-wide
# nascent is a STRESS burden, not real data (DESIGN.md §0b, the nascent scope ruling).
#
# ── THE MONO BLOCK (owner-approved 2026-09-02) ────────────────────────────────────────────────────
# Single-exon transcripts — the edge-only message case: no sj, no spliced RNA, the ONLY message source
# is the gene edge (rung 3). One 1 kb exon, 20 kb intergenic, FOUR types × the five blocks:
#   mono / capmono (unprobed / probed, mrna by block) · monosilent / capmonosilent (mrna = 0, the
#   false-positive controls). No nascent on any mono gene (nothing to model on a single exon).
#
# ── THE ISOFORM BLOCK (owner-approved 2026-09-02; TRIMMED to one structure the same day) ──────────
# Multi-exonic, multi-isoform, single-stranded transcripts — rung 3 of the message layer, grown ONE
# structure at a time (owner ruling: a moved number must have one cause). Host U = the twin shape
# (unprobed or probed), no nascent; each type adds ONE second isoform T (offsets from the gene start s;
# mirrored within the 17 kb span on a − gene). Present now:
#   altstart  T starts INSIDE U's middle exon (an alternative TSS): T = [s+8500, s+9000) [s+16000, s+17000)
#             → one exon|exon TERMINUS boundary at s+8500; outside piece [s+8000, s+8500) U-only, inside
#             piece [s+8500, s+9000) U+T
#   capaltstart  the same, probed
# Queued, each to be added on the day it becomes the target (docs/dev/MESSAGE_RUNGS.md):
#   altss (alternative splice sites → licensed exon|exon boundaries), nest (a single-exon T nested in
#   U's middle exon → a region walled by termini), instart (T's alternative first exon inside U's intron).
# U by the mature ladder (10/30/100/300/1000), T by the ANTI-ladder (100/30/10/3/1), so the terminus
# step runs from T-dominant to invisible across the blocks. The block starts at 1,365,000, pitch
# 37,000; `genome_length` stays 2.9 Mb so the gDNA density per base does not move when a structure is
# added or removed.
#
# ── THE BLANK CHROMOSOME + SHADOWS (owner design, 2026-08-29) ─────────────────────────────────────
# `test_blank` carries NO annotation; the shadow transcripts below are simulated there (both strands,
# single-exon and 3-exon, a molar ladder 250 → 1, ≈ 5 % of RNA fragments — pervasive transcription at
# a realistic dose, two DEEP shadows reproducing the contaminated seeds seen on real data). No probes:
# an annotation-designed panel cannot target what it does not know. What it controls: anything that
# trusts the annotation's notion of "pure gDNA" — the gDNA strand-overdispersion fit above all.
#
# Capture panels (rendered): BENIGN tiles each probed gene's exon UNION 8 × 125 bp seamless per union
# piece, never spanning an sj; SPARSE centres one 125 bp probe on every annotated exon of a probed gene;
# JUNCTION places one two-block probe (62 + 63 bp) per sj of a probed gene and nothing else.

