  # ── THE TERMINUS-CLUSTER BLOCK: closely spaced transcript ends that cut one exon into empty pieces ──────
  #    Host U = the twin shape; ten isoforms T1…T10 share U's first two exons and end in U's last exon 126 / 136 /
  #    138 / 140 / 141 / 142 / 143 / 144 / 146 / 147 bp past its acceptor (the shape of MIR99AHG's last exon), so
  #    the exon holds nine pieces of 1–10 bp: each is shorter than a fragment, holds no contained fragment, and
  #    leaves the crossings to its boundaries. On a − gene the cluster sits at the low end of the first exon.
