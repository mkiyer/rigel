# `test_blank` carries no annotation. These shadow transcripts are simulated there and never indexed: both
# strands, single-exon and 3-exon, a molar ladder 250 → 1 with two deep shadows, about 5 % of the RNA
# fragments. No probe targets them, since a panel designed from the annotation cannot. They test anything that
# trusts the annotation's notion of pure gDNA, the gDNA strand-overdispersion fit above all.
