  #    One shape: exon 1 kb · intron 7 kb · exon 1 kb · intron 7 kb · exon 1 kb (span 17 kb). Each type varies
  #    one bit:
  #      clean    unprobed, no nascent: introns and flanks are pure gDNA; one certified junction per intron
  #      nasc     unprobed, nascent on: a contaminated message source
  #      cap      probed, no nascent: the enrichment cliff between a source and a destination
  #      capnasc  probed, nascent on: both at once
  #      silent   probed, annotated = 0: every object is pure gDNA, so any RNA called here is a false positive
  #    Mature runs up the blocks and nascent down, in half-decade steps: annotated 10/30/100/300/1000 (silent 0),
  #    nascent 100/30/10/3/1 (nasc and capnasc only). The nascent entity spans 17 kb against 3 kb spliced, so a
