# ═══════════════════════════════════════════════════════════════════════════════════════════════
#  THE METHOD-DEVELOPMENT TEST CHROMOSOME — the ONE hand-edited file (owner ruling, 2026-09-02)
# ═══════════════════════════════════════════════════════════════════════════════════════════════
#
# ⭐⭐⭐ THIS FILE IS THE BENCHMARK (owner, 2026-08-19): the test chromosome, its transcripts and their
# abundances comprise the method-development benchmark the message policy is developed against. It
# grows ONE STRUCTURE AT A TIME. Everything else in this directory — test_chr.gtf, test_shadow.gtf,
# test_abundances.tsv and the three probe panels — is RENDERED from this file by
# `scripts/sim/build_test_reference.py` (which also derives the two-contig FASTA with a splice motif
# at every declared intron); the suite gate `tests/test_test_reference_renders.py` refuses a render
# that drifted from the YAML. ⛔ Edit THIS file, then re-run the builder; never a render.
#
# THE SCHEMA is the `rigel sim` scenario schema (docs/MANUAL.md `rigel sim`; the toy harness's
# ToySpec uses the same `genes` shape), plus two keys it lacks:
#
#   genes:                         one entry per transcript GROUP (a gene)
#     - gene_id: gB1_clean
#       strand: "+"                ⭐ explicit, always; see the strand rule below
#       probed: false              ⭐ the capture panels are DESIGNED from this (benign / sparse / junction)
#       transcripts:
#         - {t_id: B1_clean, exons: [[20000, 21000], ...], abundance: 10, nrna_abundance: 0}
#   shadow_genes:                  transcripts on the BLANK contig `test_blank` — the SIMULATOR draws from
#                                  them and the INDEX never sees them (unannotated transcription)
#
# exons are 0-based HALF-OPEN [start, end) as in every `rigel sim` scenario (a GTF line reads
# start+1 .. end). `abundance` / `nrna_abundance` are RELATIVE MOLECULAR sampling weights (mature /
# nascent). Nascent RNA needs no declaration: `rigel index` creates a single-exon nascent ENTITY spanning
# each multi-exon transcript, and the simulator pools its contributor's nrna_abundance onto it. An
# annotated single-exon transcript is its own nascent-class entity, so its weight goes in `abundance`.
#
# ⭐ THE STRAND RULE (owner, 2026-09-02): every group has an explicit strand and the chromosome carries
# EQUAL representation of + and − (the builder refuses counts differing by more than one) — a sign error
# in any strand-dependent rule is invisible on a one-strand substrate. Strands here follow
# (type index + block) mod 2, so every TYPE appears on both strands across its five blocks. Overlapping
# transcripts on opposite strands are THE BOTH-STRANDED BLOCK below; outside it, every gene keeps its
# 20 kb intergenic spacer.
#
# ── THE ANCHORED TWIN BLOCK (owner design, 2026-08-28) ───────────────────────────────────────────
# ONE shape: exon 1 kb · intron 7 kb · exon 1 kb · intron 7 kb · exon 1 kb (span 17 kb), 20 kb
# intergenic between genes; FIVE gene types varying exactly one bit each × FIVE abundance blocks:
#   clean    unprobed, no nascent — intron + flanks exactly pure gDNA; one certified sj per intron
#   nasc     unprobed, nascent ON — the contaminated message source
#   cap      probed,   no nascent — the enrichment cliff between source and destination
#   capnasc  probed,   nascent ON — both at once
#   silent   probed,   mrna = 0  — every object pure gDNA; any claimed RNA is a false positive
# Molar ladders, half-decade steps, mature UP the blocks and nascent DOWN — independent levels, as the
# big ladder draws them: mrna 10/30/100/300/1000 (silent = 0), nrna 100/30/10/3/1 (nasc/capnasc only).
# In fragment terms the nascent entity spans 17 kb against 3 kb spliced, so the per-gene nascent:mature
# fragment ratio is ≈ 5.67·nrna/mrna = 57 / 5.7 / 0.57 / 0.057 / 0.0057 across the blocks; library-wide
# nascent is a STRESS burden, not real data (DESIGN.md §0b, the nascent scope ruling).
#
# ── THE MONO BLOCK (owner-approved 2026-09-02) ────────────────────────────────────────────────────
# Single-exon transcripts — the edge-only message case: no sj, no spliced RNA, the ONLY message source
# is the gene edge (rung 3). One 1 kb exon, 20 kb intergenic, FOUR types × the five blocks:
#   mono / capmono (unprobed / probed, mrna by block) · monosilent / capmonosilent (mrna = 0, the
#   false-positive controls). No nascent on any mono gene (nothing to model on a single exon).
#
# ── THE ISOFORM BLOCK (owner-approved 2026-09-02; TRIMMED to one structure the same day) ──────────
# Multi-exonic, multi-isoform, single-stranded transcripts — rung 3 of the message layer, grown ONE
# structure at a time (owner ruling: a moved number must have one cause). Host U = the twin shape
# (unprobed or probed), no nascent; each type adds ONE second isoform T (offsets from the gene start s;
# mirrored within the 17 kb span on a − gene). Present now:
#   altstart  T starts INSIDE U's middle exon (an alternative TSS): T = [s+8500, s+9000) [s+16000, s+17000)
#             → one exon|exon TERMINUS boundary at s+8500; outside piece [s+8000, s+8500) U-only, inside
#             piece [s+8500, s+9000) U+T
#   capaltstart  the same, probed
#   altss     T splices out at an alternative DONOR 600 bp into U's middle exon: T = [s, s+1000)
#             [s+8000, s+8600) [s+16000, s+17000) → one exon|exon boundary at s+8600 carrying a DONOR flag
#             and no terminus; the piece [s+8600, s+9000) is U's exon AND T's intron (a mixed-bit region).
#             Added 2026-09-02 as the alternative-splice-site case (the owner's approval, same day).
#   capaltss  the same, probed
# ⭐ THE REPLICATION RULE FOR MULTI-ISOFORM STRUCTURES (owner, 2026-09-02): a structure is replicated
# across THREE abundance regimes of its two isoforms A (the host U) and B (the second isoform T) —
# A ≫ B (9:1), A ≪ B (1:9) and A ≈ B (1:1), suffixes `_ab`, `_ba`, `_eq` — with the PAIR's total on the
# mature ladder (10/30/100/300/1000), so the ratio and the depth are separate axes. `altstart` predates
# the rule and keeps its anti-ladder (U up, T down); it is re-cut under the rule when it is next touched.
# Queued, each to be added on the day it becomes the target:
#   nest (a single-exon T nested in U's middle exon → a region walled by termini), instart (T's
#   alternative first exon inside U's intron).
# The block starts at 1,365,000, pitch 37,000, 8 types × 5 blocks = 40 gene slots, the types
# interleaved within a block (slot = (block − 1) · n_types + type); strand = "+" when (type + block) is
# even, else "−"; `genome_length` stays 2.9 Mb so the gDNA density per base does not move when a
# structure is added or removed.
#
# ── THE BLANK CHROMOSOME + SHADOWS (owner design, 2026-08-29) ─────────────────────────────────────
# `test_blank` carries NO annotation; the shadow transcripts below are simulated there (both strands,
# single-exon and 3-exon, a molar ladder 250 → 1, ≈ 5 % of RNA fragments — pervasive transcription at
# a realistic dose, two DEEP shadows reproducing the contaminated seeds seen on real data). No probes:
# an annotation-designed panel cannot target what it does not know. What it controls: anything that
# trusts the annotation's notion of "pure gDNA" — the gDNA strand-overdispersion fit above all.
#
# Capture panels (rendered): BENIGN tiles each probed gene's exon UNION 8 × 125 bp seamless per union
# piece, never spanning an sj; SPARSE centres one 125 bp probe on every annotated exon of a probed gene;
# JUNCTION places one two-block probe (62 + 63 bp) per sj of a probed gene and nothing else.

ref_name: test_chr
#
# ── THE WALLED BLOCK (owner-approved 2026-09-03; THE SCAN's stress test) ──────────────────────────
# Exon PIECES with NO licensed face — the classes the ladder's walled-exon census found that a scan can
# reach (11,350 ladder slots, 2.0 M fragments: 35 % between two termini, 24 % junction|terminus, 17 %
# junction|junction, 17 % against a refused intron face). Host U = the twin shape; FOUR structures:
#   chain     three alternative TSSs 40 / 100 / 240 bp into exon 1 — two walled pieces in a row (60, 140 bp)
#   tssalt    a TSS 300 bp into exon 2 beside an alternative donor 600 bp in — one piece, terminus|junction
#   tandem    an alternative acceptor and donor on exon 2 — one piece between two junctions (600 bp)
#   altlast   two isoforms ending in an intronic last exon by different acceptors and TESs — two pieces
#             in a row, the last against a REFUSED intron face
# Under the REPLICATION RULE: three regimes (ab host 9 : alternatives 1 each; ba 1 : 9; eq 5 : 5),
# unprobed / probed (cap*), blocks B2 and B4 (×3, ×30 of the twin ladder / 10); slots 40–87, strands
# balanced. The chromosome grows to 4.65 Mb and the test configs' fragment budget from 480 k to 720 k so
# the existing blocks keep their depth. The refused|refused class (an exon inside an intron) is the level
# message's case and is deferred with it.
#
# ── THE TERMINUS-CLUSTER BLOCK (owner-approved 2026-09-05; the LEVEL LANE's substrate) ─────────────
# The ladder's reach census found half of its pass-zero error at nodes no message reached, and the
# mechanism is the EMPTY exon piece: closely spaced transcript ends inside one exon cut it into pieces
# shorter than a fragment, which hold no contained fragment (their solve is trivial) while their
# BOUNDARIES carry the crossings — the level lane's path (boundary → empty → boundary). Mirrored from a
# real ladder locus, MIR99AHG chr21:16,606,994–16,607,141 (+): a shared last exon whose acceptor is
# followed by TEN transcription ends 126 / 136 / 138 / 140 / 141 / 142 / 143 / 144 / 146 / 147 bp in,
# while other isoforms continue — nine pieces of 1–10 bp, every one empty, 4,200 crossings per boundary
# at the ladder's depth and one true gDNA fragment each. Here: host U = the twin shape; ten isoforms
# T1…T10 share U's first two exons and end in U's last exon at those offsets (on a − gene the cluster
# sits at the LOW end of the first exon, where a − transcript ends). Under the REPLICATION RULE with ten
# alternatives the pair total sits one rung up the ladder so the regimes stay integers: block 2 total 100
# (ab U 90 : T 1 each; ba U 10 : T 9 each; eq U 50 : T 5 each), block 4 total 1000 (×10); unprobed /
# probed (cap*); slots 88–99 at pitch 37,000 from 4,621,000; the strand alternates within a block and
# flips between the two blocks, so every type sits on both strands. The chromosome grows to 5.094 Mb
# and the test configs' fragment budget from 720 k to 840 k (RNA depth per existing transcript −3 %,
# gDNA density per base +6 %: the two cannot both be held when 6,600 abundance units join 32,328 and
# 444 kb join 4.65 Mb).
#
# ── THE BOTH-STRANDED BLOCK (owner-approved 2026-09-07) ───────────────────────────────────────────
# Overlapping transcripts on OPPOSITE strands — the nodes that admit RNA on both strands (AXIOM 0's two
# bits both set), 14 % of the ladder's chain and 38–50 % of the landed policy's remaining error on the
# stranded capture-ON rows. Every locus is TWO genes on opposite strands sharing one type token (the
# render gate's rule that every type sits on both strands is met inside the locus): the host H and the
# antisense A, ids `gB2_{cap}{type}_{regime}_H` / `_A`. Mirrored from the ladder's loci:
#   asin     an antisense's two 300 bp exons (1.5 kb intron) inside the host's first intron in transcription
#            order — TTC28-AS1 in TTC28, MYO18B-AS1 in MYO18B (58 % of the AMBIG error); host on +
#   asinrev  the same with the host on − (the antisense mirrored within the 17 kb span)
#   span     an antisense with a 300 bp exon in the host's first intron and a 2 kb exon covering the host's
#            middle exon with 500 bp overhangs into both introns — PPM1F-AS1 over TOP3B (21 %); host on +
#   conv     a simple overlap at the ends of two opposite-stranded transcripts (the owner's structure):
#            TF + exons [s+1000, s+2000) [s+10000, s+16000), TR − exons [s+14000, s+16000) [s+20000, s+21000)
#            — the 3' ends overlap in [s+14000, s+16000); s+16000 carries TF's TES+ and TR's acceptor on −,
#            a junction and a terminus on one boundary from different strands (5 %); span 21 kb
# Regimes (host : antisense), pair total 100: ab 90 : 10 (the realistic lncRNA case), ba 10 : 90 (a
# near-silent host under an expressed antisense), eq 50 : 50; unprobed and HOST-ONLY probed (`cap`: the
# probes tile the host's exons and nothing of the antisense — a capture design's enrichment cliff between
# the two strands inside one node). No nascent on the hosts in this first cut. 24 loci = 48 genes, slots
# 100–123 at pitch 37,000 from 5,065,000; the chromosome grows to 5.986 Mb and the fragment budget from
# 840 k to 960 k (gDNA density per base −3 %, RNA depth per existing transcript +8 %).
#
# ── THE sj+terminus BLOCK (owner-approved 2026-09-08; the case D of the message plan) ────────────
# ONE boundary carrying a splice junction AND a transcript terminus of the SAME strand — 386 on the
# ladder, 1–2 % of an in-scope row's error, almost all of it at the exon INSIDE the terminus, which
# today receives only the gDNA lane's lower bound (the terminus rule refuses a junction, the junction
# rules refuse a terminus). Two families, mirrored from the ladder: a transcript that STARTS at an
# internal exon's edge (RUNX1's two-exon isoform ENST00000468726 starts where exon 4 of the long isoform
# begins, chr21:35,065,072 −: TSS−+DON−) and one that ENDS at an internal exon's edge (LARGE1's isoform
# ending where exon 7 of twenty others begins, chr22:33,381,918 −: TES−+ACC−); the + strand carries the
# mirror families TSS++ACC+ and TES++DON+. Host U = the twin shape; S = U's exons 2–3 in transcription
# order, starting at exon 2's transcript-5' edge; E = U's exons 1–2, ending at exon 2's transcript-3'
# edge — so every gene makes BOTH families, one at each boundary of exon 2, and a − gene makes the − forms.
# Under the REPLICATION RULE with two alternatives: ab U 9 : S 1 : E 1, ba 1 : 9 : 9, eq 5 : 5 : 5, blocks
# B2 (×3) and B4 (×30); unprobed / probed (cap*); 12 genes, slots from 5,957,000 at pitch 37,000, the
# strand alternating within a block and flipping between them. The chromosome grows to 6.401 Mb and the
# fragment budget from 960 k to 1,030 k (2,970 abundance units join 41,965: RNA depth per existing
# transcript +0.2 %, gDNA density per base +0.3 %).
# ── THE ENCOMPASSING BLOCK (session 2026-09-14; the second both-stranded block) ────────────────────
# A long SINGLE-EXON antisense whose one exon ENCOMPASSES the whole of a spliced host on the other strand:
# every one of the host's slots admits RNA on both strands (its exons are exon∩exon, its introns are the
# antisense's exon), every boundary carries only the host's bits, and the antisense's level is measured
# nowhere but in its two single-strand FLANKS — the owner's encompassing locus (`tests/calibration/
# test_encompassing_locus.py`, a single-exon TB− over a two-exon TA+, 2026-09-13), whose remaining miss is
# the shallow flank under the intergenic gDNA edge level (`ISSUES: the-lower-bound-noise-ratchet`). On the
# ladder: 6 gene pairs — ENSG00000280007 (−, a 20.4 kb exon) over TUBA8's four-exon isoform, ENSG00000279080
# (+, 20.4 kb) over PLA2G6's three-exon isoform, ENSG00000279159 (−, 49 kb) over MTMR3's — all of the
# encompassing transcripts silent in the ladder's draw, so this is where the case is expressed. Here: host
# H = the twin shape on + at o+1,500; antisense A = one exon [o, o+20,000) on −, 1.5 kb of single-strand
# flank on each side. Regimes (H : A) ab 90 : 10, ba 10 : 90, eq 50 : 50, pair total 100; unprobed and
# HOST-ONLY probed (`cap`); ids `gB2_{cap}enc_{regime}_H` / `_A`. 6 loci = 12 genes at pitch 40,000 (span
# 20 kb + the 20 kb spacer) from 6,401,000.
# The chromosome grows to 6.641 Mb and the fragment budget from 1,030 k to 1,060 k (600 abundance
# units join 44,935: RNA depth per existing transcript +1.6 %, gDNA density per base -0.8 %).
# ── THE IN-EXON BLOCK (session 2026-09-14) ──────────────────────────────────────────────────────────
# A short SINGLE-EXON antisense gene wholly INSIDE one exon of the host, with no junction and no
# single-strand piece of its own anywhere — the slot the tilt atom's accepted limit names (`ISSUES:
# the-atom-at-an-unwitnessed-both-strand-slot`; the golden `antisense_contained`, a 1,000-fragment toy on
# which the atom reads 177.6 false gDNA of 1,000), so the panel carries its number. On the ladder: 13 gene
# pairs, six of them in a protein-coding gene's LAST exon — ENSG00000273300 (+, 427 bp, expressed) inside
# UFD1's 4.2 kb last exon, TSSK2 (+, 1,315 bp) inside ESS2's, RNF185-AS1 (−, 353 bp) inside RNF185's.
# Here: host H = the twin shape on + with a 3 kb LAST exon [o+16,000, o+19,000) (the 3' UTR); antisense
# A = one 500 bp exon [o+17,000, o+17,500) on −, 1 kb of single-strand host exon before it and 1.5 kb
# after (the host's TES side). Regimes ab
# 90 : 10 (the realistic case), ba 10 : 90, eq 50 : 50, pair total 100; unprobed / host-only probed
# (`cap`); ids `gB2_{cap}inexon_{regime}_H` / `_A`. 6 loci = 12 genes at pitch 39,000 from 6,641,000.
# The chromosome grows to 6.875 Mb and the fragment budget from 1,060 k to 1,090 k (600 abundance
# units join 45,535: RNA depth per existing transcript +1.5 %, gDNA density per base -0.7 %).
# ── THE SHARED-EXON BLOCK (session 2026-09-14; the deep stress) ─────────────────────────────────────
# Two SPLICED genes on opposite strands sharing ONE exon exactly: the host's junction certifies RNA+ at the
# exon's left face and the antisense's certifies RNA− at its right face, so the RNA level lanes deliver a
# level on EACH strand into one AMBIG exon, and each face pairs a junction on one strand with a terminus
# on the other, with no single-strand exon piece anywhere on it — the W12 deep stress (`deep_stress.py`,
# 2026-09-13; DESIGN.md §6b.15.13 judged the tilt atom on it), here at the pair total's depth rather than
# the toy's 500k. On the ladder the tail-to-tail shared LAST exon is the largest exon∩exon class: 74 of
# 241 spliced pairs — SMARCB1 (+) × DERL3 (−) share 2,715 bp of their last exons, PPIL2 × YPEL1 2,480 bp,
# DDTL × DDT 1,271 bp; the exact coincidence is the stress's idealisation. `conv` is the partial form (TR's
# last exon inside TF's, its acceptor at TF's TES); this is the exact one. Here: H + exons [o, o+2,000)
# [o+10,000, o+20,000); A − exons [o+10,000, o+20,000) [o+28,000, o+30,000). Regimes ab 90 : 10, ba 10 : 90,
# eq 50 : 50, pair total 100; unprobed / host-only probed (`cap`); ids `gB2_{cap}shared_{regime}_H` / `_A`.
# 6 loci = 12 genes at pitch 50,000 from 6,875,000.
# The chromosome grows to 7.175 Mb and the fragment budget from 1,090 k to 1,120 k (600 abundance
# units join 46,135: RNA depth per existing transcript +1.4 %, gDNA density per base -1.5 %).
genome_length: 7175000      # the shared block's last gene ends at 7,155,000; the 20 kb spacer follows
