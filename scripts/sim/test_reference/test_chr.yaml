# ═══════════════════════════════════════════════════════════════════════════════════════════════
#  THE TEST CHROMOSOME — the one hand-edited source of the method-development benchmark
# ═══════════════════════════════════════════════════════════════════════════════════════════════
#
# This file defines the test chromosome, its transcripts and their abundances. Everything else in this
# directory (test_chr.gtf, test_shadow.gtf, test_abundances.tsv and the three probe panels) is rendered from it
# by `scripts/sim/build_test_reference.py`, which also writes the two-contig FASTA with a splice motif at every
# declared intron; `tests/test_test_reference_renders.py` refuses a render that drifted from this file. Edit
# this file and re-run the builder; never edit a render. The recipe is docs/TESTING.md §0a.
#
# The schema is the `rigel sim` scenario schema plus two keys:
#
#   genes:                         one entry per gene (a transcript group)
#     - gene_id: gB1_clean
#       strand: "+"                explicit, always (the strand rule below)
#       probed: false              the capture panels are designed from this flag
#       transcripts:
#         - {t_id: B1_clean, exons: [[20000, 21000], ...], abundance: 10, nascent_abundance: 0}
#   shadow_genes:                  transcripts on the blank contig `test_blank`: simulated, never indexed
#
# Exons are 0-based half-open [start, end), as in every `rigel sim` scenario (a GTF line reads start+1 .. end).
# `abundance` and `nascent_abundance` are relative molecular sampling weights of the spliced and the nascent RNA.
# `rigel index` creates a single-exon nascent entity spanning each multi-exon transcript and the simulator
# pools the transcript's nascent_abundance onto it; an annotated single-exon transcript is its own nascent-class
# entity, so its whole weight goes in `abundance`.
#
# Strand rule: every gene has an explicit strand and the + and − counts differ by at most one (the builder
# refuses more), because a sign error in a strand-dependent rule is invisible on a one-strand substrate. In the
# single-strand blocks the strand follows (type + block) mod 2, so every type sits on both strands. Genes
# overlap on opposite strands only in the both-stranded blocks; everywhere else a gene keeps a 20 kb
# intergenic spacer.
#
# Replication rule for multi-isoform structures: each structure appears in three regimes of the host A against
# its alternative B, A ≫ B (9:1, suffix `_ab`), A ≪ B (1:9, `_ba`) and A ≈ B (1:1, `_eq`), with the pair's total
# on the mature ladder, so the ratio and the depth are separate axes. "Blocks B2 (×3) and B4 (×30)" below means
# the regime's units are multiplied by 3 and by 30.
#
# Capture panels (rendered): benign tiles each probed gene's exon union with 8 × 125 bp probes, seamless from each
# union piece's start and never spanning a junction (a piece shorter than one probe gets one probe centred on
# it); sparse centres one 125 bp probe on every annotated exon of a probed gene; junction places one two-block
# probe (62 + 63 bp) on each junction of a probed gene and nothing else.
#
# The blocks, in chromosome order, are described where each starts below: twin, mono, isoform, walled,
# terminus-cluster, both-stranded, sj+terminus, encompassing, in-exon, shared-exon, in-intron, head-to-head and
# tiny-exon; the shadow genes on `test_blank` follow them.

ref_name: test_chr
