[build-system]
requires = ["scikit-build-core>=0.12,<2", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "rigel-rnaseq"
version = "0.7.1"
description = "Bayesian RNA-seq transcript quantification tool"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.12"
authors = [
    { name = "Matthew Iyer" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pysam>=0.22",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "rigel-rnaseq[report]",
]
# QC report builder (`rigel report`). vl-convert-python ships the Vega / Vega-Lite
# / Vega-Embed JavaScript runtime inside its wheel, so reports are fully
# self-contained and render offline with no CDN or Node dependency.
report = [
    "vl-convert-python>=1.7",
]

[project.scripts]
rigel = "rigel.cli:main"

[project.urls]
Homepage = "https://github.com/mkiyer/rigel"
Repository = "https://github.com/mkiyer/rigel"
Documentation = "https://github.com/mkiyer/rigel/blob/main/docs/MANUAL.md"
Changelog = "https://github.com/mkiyer/rigel/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/mkiyer/rigel/issues"

[tool.scikit-build]
# The behaviours of the backend versions build-system.requires admits; a pin keeps the sdist's name
# (rigel_rnaseq-<version>.tar.gz, which the conda recipe fetches) the same whichever of them builds it
minimum-version = "build-system.requires"

# The sdist carries the package and its build, not the development sandbox, editor or agent settings, or images
sdist.exclude = ["docs/dev", "docs/images", ".claude", ".vscode", ".github", "CLAUDE.md"]

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

# Tell scikit-build-core where to find the Python package
wheel.packages = ["src/rigel"]

# The wheel carries what runs: the compiled extensions, not their C and C++ sources
wheel.exclude = ["rigel/native/**", "rigel/cgranges/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
